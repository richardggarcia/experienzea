[package]
name = "asset-nft"
version = "0.1.0"
edition = "2021"
rust-version = "1.81.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = { version = "25.1.0" }

[dev-dependencies]
soroban-sdk = { version = "25.1.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = true
lto = true
panic = "abort"
codegen-units = 1
